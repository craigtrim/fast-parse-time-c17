name: C17 verification
on: [push, pull_request, workflow_dispatch]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
      FPT_LIBRARY: ${{ github.workspace }}/build-linux/libfast_parse_time.so
      FPT_CLI: ${{ github.workspace }}/build-linux/fpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and native tests
        run: |
          ./build.sh --package --jobs 2
          version=$(./build-linux/fpt --version)
          version=${version%% *}
          echo "FPT_LINUX_PACKAGE=fast-parse-time-c17-$version-linux-$(uname -m)" >> "$GITHUB_ENV"
      - name: Frozen corpus, arithmetic, CLI
        run: |
          python tests/differential.py --corpus tests/data/observations.jsonl --calendar-corpus tests/data/calendar-observations.jsonl
          python tests/arithmetic_parity.py
          python tests/cli_checks.py
      - name: Installed CMake consumer
        run: |
          cmake -S "dist/$FPT_LINUX_PACKAGE/examples" -B build-consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/dist/$FPT_LINUX_PACKAGE"
          cmake --build build-consumer
          ./build-consumer/fpt_example
      - name: Verify packaged executable
        run: |
          mkdir -p build-package-check
          tar -xzf "dist/$FPT_LINUX_PACKAGE.tar.gz" -C build-package-check
          version=$(./build-linux/fpt --version)
          version=${version%% *}
          FPT_CLI="$PWD/build-package-check/$FPT_LINUX_PACKAGE/bin/fpt-$version" python tests/cli_checks.py
      - name: Address and undefined-behavior sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFPT_SANITIZE=ON
          cmake --build build-sanitize --parallel 2
          ctest --test-dir build-sanitize --output-on-failure
          FPT_CLI="$PWD/build-sanitize/fpt" python tests/cli_checks.py
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: fast-parse-time-linux-${{ matrix.compiler }}
          path: dist/*-linux-*.tar.gz
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Build and native tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Frozen corpus, arithmetic, CLI
        run: |
          python tests/differential.py --corpus tests/data/observations.jsonl --calendar-corpus tests/data/calendar-observations.jsonl
          python tests/arithmetic_parity.py
          python tests/cli_checks.py
      - name: Installed CMake consumer
        run: |
          cmake --install build --prefix "$PWD/install-test"
          cmake -S examples -B build-consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/install-test"
          cmake --build build-consumer
          ./build-consumer/fpt_example.exe
